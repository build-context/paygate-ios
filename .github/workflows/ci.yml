name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build for iOS Simulator
        run: xcodebuild -scheme Paygate -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The tag and the pod are tracked separately on purpose. The podspec's
      # source is pinned to "v#{s.version}", so `pod trunk push` validates by
      # fetching that tag and the tag must already exist when it runs. Gating
      # the push on the tag instead would mean any failure after the tag was
      # created (an expired trunk token, say) leaves the release wedged: every
      # re-run sees the tag, skips, and reports green without ever publishing.
      - name: Detect version, tag, and publish status
        id: ver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "tag_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_missing=true" >> "$GITHUB_OUTPUT"
          fi
          if curl -sf "https://trunk.cocoapods.org/api/v1/pods/Paygate" \
            | jq -e --arg v "$VERSION" '.versions[]?.name | select(. == $v)' >/dev/null; then
            echo "pod_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "pod_missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push release tag
        if: steps.ver.outputs.tag_missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
      - name: Publish to CocoaPods trunk
        if: steps.ver.outputs.pod_missing == 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]; then
            echo "::notice::COCOAPODS_TRUNK_TOKEN not set; skipping pod trunk push"
            exit 0
          fi
          gem install cocoapods --no-document
          pod trunk push Paygate.podspec --allow-warnings
